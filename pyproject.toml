[project]
name = "sci-skt-data-pipeline"
version = "0.1.0"
description = "Scientific task generation and quality-control workflows powered by NeMo Data Designer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "data-designer==0.9.2",
    "harbor==0.23.0",
    "pydantic>=2.9.2,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1.1,<2",
]

[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project.scripts]
sci-pipeline = "sci_pipeline.cli:main"
sci-source = "sci_pipeline.source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sci_pipeline = ["resources/*.md"]

[tool.uv]
required-version = ">=0.11.14,<0.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
